<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Agent Teams · 无法连接</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { max-width: 420px; padding: 32px; text-align: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.6; opacity: 0.75; margin: 0 0 20px; }
      code { font-size: 12px; opacity: 0.6; word-break: break-all; }
      button { font: inherit; font-size: 14px; padding: 8px 24px; border-radius: 8px; border: 0; background: #3b4258; color: #fff; cursor: pointer; }
      button:hover { background: #2c3243; }
      .logo { display: inline-grid; grid-template-columns: 20px 20px; gap: 4px; }
      .logo i { width: 20px; height: 20px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true"><i style="background:#f0954a"></i><i style="background:#4fc39a"></i><i style="background:#7aa8ff"></i><i style="background:#3b4258"></i></div>
      <h1>无法连接到 Agent Teams</h1>
      <p>请检查网络连接。网络恢复后会自动重新加载，也可以点下面的按钮重试。</p>
      <button id="retry" type="button">重试</button>
      <p><code id="detail"></code></p>
    </main>
    <script src="offline-page.js"></script>
  </body>
</html>
