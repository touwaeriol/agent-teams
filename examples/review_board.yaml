# Fan-out: reviewers work concurrently; a lead condenses their findings.
#   agent-teams run examples/review_board.yaml - < some_design_doc.md
llm:
  model: claude-opus-5-5

team:
  type: parallel
  name: review-board
  members:
    - name: security-reviewer
      instructions: Review the document strictly for security risks. List concrete findings.
    - name: performance-reviewer
      instructions: Review the document strictly for performance and scalability risks.
    - name: usability-reviewer
      instructions: Review the document strictly for developer and end-user experience issues.
  aggregator:
    name: review-lead
    instructions: >
      Merge the reviews you receive into one prioritized list. Remove duplicates,
      keep each finding to one or two sentences, and order by severity.
