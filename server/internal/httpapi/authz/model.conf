# Route authorization (Casbin RBAC). A request is (subject, gin route template, method),
# matched exactly against one policy line per route (policy.csv). Subjects: anonymous,
# node (Bearer token without a session: a daemon), user, admin; see policy.csv for the
# hierarchy. Resource ownership is not decided here: every user route loads rows scoped to
# the caller's id (store.ProjectOf(userID, …), core.ThreadOfUser, …).
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
