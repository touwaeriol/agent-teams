# Route authorization (Casbin RBAC). A request is (subject, gin route template, method),
# matched exactly against one policy line per route (policy.csv). The subject is the signed-in
# user's id, else node (Bearer token without a session: a daemon) or anonymous. g maps a user
# id to its role (one row per user in the casbin_rule table: g, <user id>, admin | user) and
# roles to roles (the hierarchy in policy.csv: admin > user > anonymous > public). Resource ownership is not decided here: every user route loads rows scoped to
# the caller's id (store.ProjectOf(userID, …), core.ThreadOfUser, …).
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
