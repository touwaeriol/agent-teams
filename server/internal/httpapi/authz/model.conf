# Route authorization (Casbin RBAC). A request is (role, gin route template, method).
# Roles: anonymous < user < admin. anonymous also holds the "public" and
# "node-token" permission sets (node-token routes check the daemon's token in the
# handler). Resource ownership is not decided here: every user route loads rows
# scoped to the caller's id (store.ProjectOf(userID, …), core.ThreadOfUser, …).
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && regexMatch(r.act, p.act)
