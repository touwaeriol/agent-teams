<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Teams</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #3b5bdb; --accent-text: #ffffff; --user: #e7ecff; --error: #c92a2a;
    --done: #2b8a3e; --running: #e67700; --pending: #868e96;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e8ee; --muted: #9aa2b4; --line: #2b313d;
      --accent: #5c7cfa; --accent-text: #ffffff; --user: #26304a; --error: #ff6b6b;
      --done: #51cf66; --running: #ffa94d; --pending: #adb5bd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr 300px; height: 100vh; }
  aside, section { background: var(--panel); border-right: 1px solid var(--line);
                   display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
           display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button.link { background: none; color: var(--muted); padding: 0; }
  .list { overflow-y: auto; flex: 1; }
  .conv { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv.active { background: var(--user); }
  main { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 10px; background: var(--panel);
         border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.error { color: var(--error); }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; height: 64px; padding: 8px 10px; border-radius: 8px; font: inherit;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .task { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .task .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .task .status.done { color: var(--done); } .task .status.running { color: var(--running); }
  .task .status.pending { color: var(--pending); } .task .status.failed,
  .task .status.cancelled { color: var(--error); }
  .task .body { color: var(--muted); margin-top: 4px; }
  details { border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  summary { padding: 8px 16px; cursor: pointer; }
  #activity { max-height: 220px; overflow-y: auto; padding: 0 16px 8px; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 24px 16px; }
  #login { position: fixed; inset: 0; background: var(--bg); display: none;
           align-items: center; justify-content: center; padding: 16px; }
  #login form { flex-direction: column; width: min(360px, 100%); border: 1px solid var(--line); border-radius: 10px; }
  #login input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--text); font: inherit; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside .list { max-height: 120px; }
    #tasks-panel .list { max-height: 160px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>对话 <button id="new">新建</button></header>
    <div class="list" id="conversations"></div>
  </aside>
  <main>
    <header><span id="title">选择或新建一个对话</span><button class="link" id="logout">退出登录</button></header>
    <div id="messages"><div class="empty">和 leader 说说你要做什么。他派完任务会立刻回复，员工在后台干活，你可以随时继续聊。</div></div>
    <form id="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
      <button id="send" disabled>发送</button>
    </form>
  </main>
  <section id="tasks-panel">
    <header>任务板</header>
    <div class="list" id="tasks"><div class="empty">暂无任务</div></div>
    <details><summary>活动日志</summary><div id="activity"></div></details>
  </section>
</div>
<div id="login">
  <form id="login-form">
    <strong>Agent Teams</strong>
    <input id="token" type="password" placeholder="访问令牌（AGENT_TEAMS_TOKEN）" autocomplete="current-password">
    <button>进入</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const state = { current: null, source: null, seen: new Set(), tasks: new Map() };

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json" } });
  if (response.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function showLogin() { $("login").style.display = "flex"; $("token").focus(); }

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const WHO = { user: "你", leader: "leader", error: "错误" };

function addMessage(message) {
  if (state.seen.has(message.id)) return;
  state.seen.add(message.id);
  const box = $("messages");
  box.querySelector(".empty")?.remove();
  const node = element("div", `msg ${message.role}`);
  node.append(element("div", "who", WHO[message.role] || message.role), message.content);
  box.append(node);
  box.scrollTop = box.scrollHeight;
}

const STATUS = { pending: "等待中", running: "进行中", done: "已完成", failed: "失败", cancelled: "已取消" };

function renderTasks() {
  const box = $("tasks");
  box.replaceChildren();
  if (!state.tasks.size) { box.append(element("div", "empty", "暂无任务")); return; }
  for (const task of state.tasks.values()) {
    const node = element("div", "task");
    const head = element("div", "head");
    head.append(element("span", "", `${task.id} · ${task.assignee}`),
                element("span", `status ${task.status}`, STATUS[task.status] || task.status));
    const after = task.depends_on.length ? `（依赖 ${task.depends_on.join(", ")}）` : "";
    node.append(head, element("div", "body", task.instruction + after));
    if (task.output) node.append(element("div", "body", task.output.slice(0, 400)));
    box.append(node);
  }
}

function addActivity(text) {
  const box = $("activity");
  box.append(text + "\n");
  box.scrollTop = box.scrollHeight;
}

const HANDLERS = {
  message: (event) => addMessage(event.message),
  task: (event) => { state.tasks.set(event.task.id, event.task); renderTasks(); },
  activity: (event) => addActivity(event.text),
};

async function loadConversations() {
  const list = await api("/api/conversations");
  const box = $("conversations");
  box.replaceChildren();
  for (const conversation of list) {
    const node = element("div", "conv", conversation.title || conversation.id);
    if (conversation.id === state.current) node.classList.add("active");
    node.onclick = () => openConversation(conversation);
    box.append(node);
  }
  return list;
}

async function openConversation(conversation) {
  state.current = conversation.id;
  state.seen.clear();
  state.tasks.clear();
  state.source?.close();
  $("title").textContent = conversation.title || conversation.id;
  $("messages").replaceChildren();
  $("activity").replaceChildren();
  $("input").disabled = $("send").disabled = false;
  const base = `/api/conversations/${conversation.id}`;
  state.source = new EventSource(`${base}/events`);
  state.source.onmessage = (raw) => { const event = JSON.parse(raw.data); HANDLERS[event.type]?.(event); };
  const [messages, tasks] = await Promise.all([api(`${base}/messages`), api(`${base}/tasks`)]);
  messages.forEach(addMessage);
  tasks.forEach((task) => state.tasks.set(task.id, task));
  renderTasks();
  loadConversations();
  $("input").focus();
}

async function send() {
  const content = $("input").value.trim();
  if (!content || !state.current) return;
  $("input").value = "";
  const title = $("title").textContent;
  addMessage(await api(`/api/conversations/${state.current}/messages`, {
    method: "POST", body: JSON.stringify({ content }),
  }));
  if (title === state.current) loadConversations();
}

$("composer").onsubmit = (event) => { event.preventDefault(); send(); };
$("input").onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); send(); }
};
$("new").onclick = async () => {
  const title = prompt("对话标题（可留空）", "") ?? "";
  openConversation(await api("/api/conversations", { method: "POST", body: JSON.stringify({ title }) }));
};
$("logout").onclick = async () => { await fetch("/session", { method: "DELETE" }); location.reload(); };
$("login-form").onsubmit = async (event) => {
  event.preventDefault();
  const response = await fetch("/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: $("token").value.trim() }),
  });
  if (!response.ok) { $("token").value = ""; $("token").placeholder = "令牌不对，请重试"; return; }
  $("login").style.display = "none";
  start();
};

async function start() {
  const list = await loadConversations();
  if (list.length && !state.current) openConversation(list[0]);
}

start().catch(() => {});  // shows the login form on 401
</script>
</body>
</html>
