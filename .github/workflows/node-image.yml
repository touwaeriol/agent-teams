name: node image

# Builds deploy/node/Dockerfile and publishes ghcr.io/<owner>/agent-teams-node.
# develop is the release branch: every push there that touches the daemon or the image
# publishes :latest, :develop and :sha-<short>. Other branches build only (no push).
on:
  push:
    paths:
      - node/**
      - protocol/**
      - deploy/node/**
      - .github/workflows/node-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: node-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-teams-node
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=agent-teams-node
            org.opencontainers.image.description=agent-teams node daemon with Claude Code, Codex, git and gh
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node/Dockerfile
          # amd64 on every build; arm64 (QEMU, slower) only when publishing.
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
