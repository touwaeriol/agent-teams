name: CI

# Push only: every branch is pushed to this repository, so a pull_request
# trigger would only run the same commit twice.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (Go, PostgreSQL, Valkey)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: make go-modcache
      - run: server/scripts/test.sh

  protocol:
    name: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: make test-protocol

  node:
    name: node daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
