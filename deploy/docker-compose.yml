# agent-teams v2: Go control plane + PostgreSQL 17 + Valkey.
# Always run through deploy/compose.sh (project directory = repository root, so ./data and
# ./office resolve against it):
#
#   deploy/compose.sh build
#   deploy/compose.sh up -d          # postgres, valkey → migrate (atctl migrate up) → control-plane
#
# Secrets and ports come from the env file (default: <repo>/.env, override with ENV_FILE=...).
# The control plane listens on ${BIND:-127.0.0.1}:${PORT}; Caddy proxies the public domain to it.
# The image contains the built web app and the node daemon tarball (served at /node/dist/);
# office layouts are mounted from ${OFFICE_HOST_DIR:-./office} and hot-reloaded.
# Production keeps the source in ./src next to this file: set BUILD_CONTEXT=./src and
# OFFICE_HOST_DIR=./src/office there (see README.md, "Deploy").
name: ${COMPOSE_PROJECT_NAME:-agent-teams}

x-control-plane-env: &cp-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-agent_teams}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_teams}?sslmode=disable
  VALKEY_URL: valkey://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD}@valkey:6379/0
  AGENT_TEAMS_SECRET_KEY: ${AGENT_TEAMS_SECRET_KEY:?set AGENT_TEAMS_SECRET_KEY (never change it once set)}
  AGENT_TEAMS_SECRET_KEYS: ${AGENT_TEAMS_SECRET_KEYS:-}
  AGENT_TEAMS_PUBLIC_URL: ${AGENT_TEAMS_PUBLIC_URL:?set AGENT_TEAMS_PUBLIC_URL}
  AGENT_TEAMS_ADMIN_EMAILS: ${AGENT_TEAMS_ADMIN_EMAILS:-}
  GITHUB_API_URL: ${GITHUB_API_URL:-}
  GITHUB_WEB_URL: ${GITHUB_WEB_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BIND: 0.0.0.0
  PORT: ${PORT:?set PORT}
  # Object store of attachments and shared files (#58; all empty = uploads refused, see env.example).
  AGENT_TEAMS_S3_ENDPOINT: ${AGENT_TEAMS_S3_ENDPOINT:-}
  AGENT_TEAMS_S3_PUBLIC_ENDPOINT: ${AGENT_TEAMS_S3_PUBLIC_ENDPOINT:-}
  AGENT_TEAMS_S3_BUCKET: ${AGENT_TEAMS_S3_BUCKET:-}
  AGENT_TEAMS_S3_ACCESS_KEY: ${AGENT_TEAMS_S3_ACCESS_KEY:-}
  AGENT_TEAMS_S3_SECRET_KEY: ${AGENT_TEAMS_S3_SECRET_KEY:-}
  AGENT_TEAMS_S3_REGION: ${AGENT_TEAMS_S3_REGION:-}
  AGENT_TEAMS_S3_PATH_STYLE: ${AGENT_TEAMS_S3_PATH_STYLE:-}
  AGENT_TEAMS_ATTACHMENT_TTL: ${AGENT_TEAMS_ATTACHMENT_TTL:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_teams}
      POSTGRES_DB: ${POSTGRES_DB:-agent_teams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --appendonly yes"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: &cp-build
      context: ${BUILD_CONTEXT:-.}
      dockerfile: server/Dockerfile
    image: ${AGENT_TEAMS_IMAGE:-agent-teams-server:latest}
    command: ["migrate", "up"]
    restart: "no"
    environment: *cp-env
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    build: *cp-build
    image: ${AGENT_TEAMS_IMAGE:-agent-teams-server:latest}
    command: ["serve"]
    restart: unless-stopped
    environment: *cp-env
    volumes:
      - ${OFFICE_HOST_DIR:-./office}:/srv/office:ro
      # Mirrors of standalone Git repositories (git-repos.md §5): a cache, rebuilt from the upstream when lost.
      - git-mirrors:/var/lib/agent-teams/git-mirrors
    ports:
      - "${BIND:-127.0.0.1}:${PORT}:${PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

volumes:
  git-mirrors:
