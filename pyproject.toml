[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-teams"
version = "0.1.0"
description = "Composable multi-agent teams built on the Claude API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "valkey>=6.0",
]
dev = [
    "agent-teams[server]",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
agent-teams = "agent_teams.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_teams"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "RET", "PL", "RUF", "N", "ASYNC", "PT"]
ignore = ["PLR0913", "PLR2004"]
# Chinese punctuation is expected in user-facing strings.
allowed-confusables = ["，", "：", "（", "）", "？", "！", "；"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-nested-blocks = 3
max-branches = 8

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# valkey's asyncio client ships without complete annotations.
module = ["agent_teams.server.broker"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
